name: Count Lines & Languages

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  count-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc jq python3-lxml

      - name: Get all repos
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            TOKEN="${{ secrets.PAT_TOKEN }}"
          else
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          curl -s -H "Authorization: token $TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/user/repos?per_page=100&affiliation=owner" > personal_repos.json

          curl -s -H "Authorization: token $TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/orgs/RoboNexxus/repos?per_page=100" > org_repos.json

          if jq -e 'type == "array"' personal_repos.json > /dev/null 2>&1; then
            jq -r '.[] | "AtharvM02222/\(.name)"' personal_repos.json > repo_list.txt
          else
            touch repo_list.txt
          fi

          if jq -e 'type == "array"' org_repos.json > /dev/null 2>&1; then
            jq -r '.[] | "RoboNexxus/\(.name)"' org_repos.json >> repo_list.txt
          fi

          echo "Total repos: $(wc -l < repo_list.txt)"

      - name: Clone and count lines with language stats
        env:
          TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          total_code=0
          total_added=0
          total_changed=0
          repo_count=0

          declare -A lang_lines
          declare -A lang_display

          mkdir -p temp_repos

          while IFS= read -r repo; do
            echo "Processing $repo..."
            git clone --depth=1000 https://x-access-token:${TOKEN}@github.com/$repo.git temp_repos/$repo 2>/dev/null || continue

            cloc temp_repos/$repo --json --quiet > cloc_output.json 2>/dev/null || continue

            code=$(jq -r '.SUM.code // 0' cloc_output.json)

            if [ "$code" -gt 0 ]; then
              total_code=$((total_code + code))
              repo_count=$((repo_count + 1))

              # Collect every language cloc found (excluding SUM and header keys)
              while IFS= read -r lang; do
                lang_code=$(jq -r --arg lang "$lang" '.[$lang].code // 0' cloc_output.json)
                if [ "$lang_code" -gt 0 ]; then
                  # Normalize name for use as env var key
                  norm=$(echo "$lang" | sed 's/C++/CPP/g; s/C#/CSharp/g; s/C\/C++ Header/CPP_Header/g; s/[^a-zA-Z0-9_]/_/g')
                  current_val=${lang_lines[$norm]:-0}
                  lang_lines[$norm]=$((current_val + lang_code))
                  # Store original display name alongside (first time seen)
                  if [ -z "${lang_display[$norm]+x}" ]; then
                    lang_display[$norm]="$lang"
                  fi
                fi
              done < <(jq -r 'keys[] | select(. != "SUM" and . != "header")' cloc_output.json)

              # All-time added + changed via git numstat
              while IFS=$'\t' read -r added removed file; do
                if [[ "$added" =~ ^[0-9]+$ ]] && [[ "$removed" =~ ^[0-9]+$ ]]; then
                  total_added=$((total_added + added))
                  total_changed=$((total_changed + added + removed))
                fi
              done < <(git -C temp_repos/$repo log --pretty=tformat: --numstat 2>/dev/null)
            fi

            rm -rf temp_repos/$repo
          done < repo_list.txt

          total_added_fmt=$(printf "%'d" $total_added)
          total_changed_fmt=$(printf "%'d" $total_changed)

          echo "TOTAL_CODE=$total_code" >> $GITHUB_ENV
          echo "REPO_COUNT=$repo_count" >> $GITHUB_ENV
          echo "TOTAL_ADDED=$total_added" >> $GITHUB_ENV
          echo "TOTAL_ADDED_FMT=$total_added_fmt" >> $GITHUB_ENV
          echo "TOTAL_CHANGED=$total_changed" >> $GITHUB_ENV
          echo "TOTAL_CHANGED_FMT=$total_changed_fmt" >> $GITHUB_ENV

          # Sort all languages by line count, write top 15 to file
          if [ "$total_code" -gt 0 ]; then
            # Write two parallel files: one with "lines|norm_key" and one with "norm_key|display_name"
            for norm in "${!lang_lines[@]}"; do
              echo "${lang_lines[$norm]}|${norm}|${lang_display[$norm]}"
            done | sort -t'|' -rn -k1 | head -15 > top_langs_raw.txt

            echo "=== Top Languages ==="
            cat top_langs_raw.txt

            rank=1
            while IFS='|' read -r lines norm display; do
              pct=$(awk "BEGIN {printf \"%.1f\", ($lines / $total_code) * 100}")
              echo "LANG${rank}_NAME=$display" >> $GITHUB_ENV
              echo "LANG${rank}_LINES=$lines" >> $GITHUB_ENV
              echo "LANG${rank}_PCT=$pct" >> $GITHUB_ENV
              rank=$((rank + 1))
            done < top_langs_raw.txt
            echo "LANG_COUNT=$((rank - 1))" >> $GITHUB_ENV
          fi

      - name: Fetch contribution streak
        env:
          TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, datetime

          token    = os.environ.get("TOKEN", "")
          username = "AtharvM02222"

          def graphql(query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          try:
              # Step 1: get account creation year
              user_q = """
              query($login: String!) {
                user(login: $login) { createdAt }
              }"""
              user_data = graphql(user_q, {"login": username})
              created_at = user_data["data"]["user"]["createdAt"]
              start_year = int(created_at[:4])
              current_year = datetime.date.today().year

              print(f"Account created: {created_at}, scanning {start_year}–{current_year}")

              # Step 2: fetch each year's contribution calendar
              cal_q = """
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                        }
                      }
                    }
                  }
                }
              }"""

              all_days = []   # list of (date_str, count)
              total_all_time = 0

              for year in range(start_year, current_year + 1):
                  from_dt = f"{year}-01-01T00:00:00Z"
                  to_dt   = f"{year}-12-31T23:59:59Z"
                  data = graphql(cal_q, {"login": username, "from": from_dt, "to": to_dt})
                  cal  = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
                  total_all_time += cal["totalContributions"]
                  for week in cal["weeks"]:
                      for day in week["contributionDays"]:
                          all_days.append((day["date"], day["contributionCount"]))
                  print(f"  {year}: {cal['totalContributions']} contributions")

              # Deduplicate and sort
              all_days = sorted(set(all_days), key=lambda x: x[0])

              today = datetime.date.today().isoformat()

              # Current streak: walk backwards from today
              current = 0
              for date, count in reversed(all_days):
                  if date > today:
                      continue
                  if count > 0:
                      current += 1
                  else:
                      break

              # Longest streak: single pass
              longest = 0
              run = 0
              for _, count in all_days:
                  if count > 0:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0

              print(f"All-time total: {total_all_time:,}, Current streak: {current}, Longest: {longest}")

              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"STREAK_CURRENT={current}\n")
                  f.write(f"STREAK_LONGEST={longest}\n")
                  f.write(f"STREAK_TOTAL={total_all_time}\n")

          except Exception as e:
              import traceback
              traceback.print_exc()
              print(f"Streak fetch failed: {e}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("STREAK_CURRENT=0\nSTREAK_LONGEST=0\nSTREAK_TOTAL=0\n")
          PYEOF

      - name: Update SVGs with all stats
        run: |
          python3 << 'PYEOF'
          import os, re
          from lxml import etree

          def fmt(n):
              try:
                  return f"{int(n):,}"
              except:
                  return str(n)

          env = os.environ

          total_code      = fmt(env.get("TOTAL_CODE", "0"))
          repo_count      = env.get("REPO_COUNT", "0")
          total_added     = fmt(env.get("TOTAL_ADDED", "0"))
          total_changed   = fmt(env.get("TOTAL_CHANGED", "0"))
          total_deleted   = fmt(max(0, int(env.get("TOTAL_CHANGED", "0")) - int(env.get("TOTAL_ADDED", "0"))))
          streak_current  = env.get("STREAK_CURRENT", "0")
          streak_longest  = env.get("STREAK_LONGEST", "0")
          streak_total    = fmt(env.get("STREAK_TOTAL", "0"))
          lang_count      = int(env.get("LANG_COUNT", "0"))

          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          langs = []
          for i in range(1, 16):
              name  = env.get(f"LANG{i}_NAME", "-")
              lines = env.get(f"LANG{i}_LINES", "0")
              pct   = env.get(f"LANG{i}_PCT", "0")
              if i <= lang_count and name and name != "-":
                  langs.append((name, fmt(lines), f"({pct}%)"))
              else:
                  langs.append(("-", "-", "(-)"))

          def update_svg(filename):
              tree = etree.parse(filename)
              root = tree.getroot()

              def set_id(eid, text):
                  el = root.find(f".//*[@id='{eid}']")
                  if el is not None:
                      el.text = text

              # LOC
              set_id("loc_data",    total_code)
              set_id("loc_add",     total_added)
              set_id("loc_del",     total_deleted)
              set_id("loc_changed", total_changed)

              # Streak
              set_id("streak_current", streak_current)
              set_id("streak_longest", streak_longest)
              set_id("streak_total",   streak_total)

              # Languages
              for i, (name, lines, pct) in enumerate(langs, 1):
                  set_id(f"lang{i}_name",  name)
                  set_id(f"lang{i}_lines", lines)
                  set_id(f"lang{i}_pct",   pct)

              # "Across all X repositories" subheader — find by text content
              for el in root.iter():
                  if el.text and "Across all" in el.text:
                      el.text = f"Across all {repo_count} repositories"
                      break

              # Footer timestamp
              set_id("last_updated", f"Last updated: {now}")

              tree.write(filename, encoding="utf-8", xml_declaration=True)
              print(f"✅ Updated {filename}")

          update_svg("light_mode.svg")
          update_svg("dark_mode.svg")
          print(f"Languages updated: {lang_count}")
          print(f"Streak: current={streak_current}, longest={streak_longest}, total={streak_total}")
          PYEOF

      - name: Update README badges
        run: |
          python3 << 'PYEOF'
          import re, os

          total_code        = os.environ.get("TOTAL_CODE", "0")
          repo_count        = os.environ.get("REPO_COUNT", "0")
          total_added_fmt   = os.environ.get("TOTAL_ADDED_FMT", "0")
          total_changed_fmt = os.environ.get("TOTAL_CHANGED_FMT", "0")

          total_lines_url   = total_code.replace(",", "%2C")
          total_added_url   = total_added_fmt.replace(",", "%2C")
          total_changed_url = total_changed_fmt.replace(",", "%2C")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'Total_Lines-[^"\'<\s]+-00d9ff',   f'Total_Lines-{total_lines_url}-00d9ff', content)
          content = re.sub(r'Repositories-\d+-00d9ff',          f'Repositories-{repo_count}-00d9ff', content)
          content = re.sub(r'Lines_Added-[^"\'<\s]+-00d9ff',    f'Lines_Added-{total_added_url}-00d9ff', content)
          content = re.sub(r'Lines_Changed-[^"\'<\s]+-00d9ff',  f'Lines_Changed-{total_changed_url}-00d9ff', content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          print("✅ README updated")
          PYEOF

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md light_mode.svg dark_mode.svg

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update: stats, all languages, streak"

          for i in 1 2 3; do
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main && break
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} main
          done
