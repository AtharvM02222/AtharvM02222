name: Count Lines & Languages

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc jq python3-lxml

      - name: Get all repos
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${PAT_TOKEN:-$GITHUB_TOKEN}"

          curl -s -H "Authorization: token $TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/user/repos?per_page=100&affiliation=owner" > personal_repos.json

          curl -s -H "Authorization: token $TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/orgs/RoboNexxus/repos?per_page=100" > org_repos.json

          if jq -e 'type == "array"' personal_repos.json > /dev/null 2>&1; then
            jq -r '.[] | "AtharvM02222/\(.name)"' personal_repos.json > repo_list.txt
          else
            touch repo_list.txt
          fi

          if jq -e 'type == "array"' org_repos.json > /dev/null 2>&1; then
            jq -r '.[] | "RoboNexxus/\(.name)"' org_repos.json >> repo_list.txt
          fi

          echo "Total repos: $(wc -l < repo_list.txt)"

      - name: Clone and count lines with language stats
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${PAT_TOKEN:-$GITHUB_TOKEN}"
          mkdir -p temp_repos

          # Clone all repos and run cloc, saving JSON output per repo
          mkdir -p cloc_outputs
          total_added=0
          total_changed=0
          repo_count=0

          while IFS= read -r repo; do
            echo "Processing $repo..."
            git clone --depth=1000 https://x-access-token:${TOKEN}@github.com/$repo.git temp_repos/$repo 2>/dev/null || continue

            # Exclude data/config files — only count actual source code
            cloc temp_repos/$repo \
              --json --quiet \
              --exclude-lang=JSON,YAML,TOML,XML,CSV,INI,Text,Markdown,HTML,SVG \
              --not-match-f='\.(lock|min\.js|min\.css|pb\.go|pb\.py)$' \
              > cloc_outputs/${repo//\//_}.json 2>/dev/null || true

            # git numstat for lines added/changed
            while IFS=$'\t' read -r added removed file; do
              if [[ "$added" =~ ^[0-9]+$ ]] && [[ "$removed" =~ ^[0-9]+$ ]]; then
                total_added=$((total_added + added))
                total_changed=$((total_changed + added + removed))
              fi
            done < <(git -C temp_repos/$repo log --pretty=tformat: --numstat 2>/dev/null)

            repo_count=$((repo_count + 1))
            rm -rf temp_repos/$repo
          done < repo_list.txt

          total_added_fmt=$(printf "%'d" $total_added)
          total_changed_fmt=$(printf "%'d" $total_changed)

          echo "REPO_COUNT=$repo_count"         >> $GITHUB_ENV
          echo "TOTAL_ADDED=$total_added"        >> $GITHUB_ENV
          echo "TOTAL_ADDED_FMT=$total_added_fmt" >> $GITHUB_ENV
          echo "TOTAL_CHANGED=$total_changed"    >> $GITHUB_ENV
          echo "TOTAL_CHANGED_FMT=$total_changed_fmt" >> $GITHUB_ENV

      - name: Aggregate language stats
        run: |
          python3 << 'PYEOF'
          import json, os, glob
          from pathlib import Path

          # Languages to exclude (data/markup, not real code)
          EXCLUDE = {
              "JSON", "YAML", "TOML", "XML", "CSV", "INI", "Text",
              "Markdown", "reStructuredText", "SVG", "HTML", "CSS",
              "Dockerfile", "make", "CMake", "Gradle", "Maven",
              "Properties", "Ignore List", "gitignore", "diff",
              "ASP.NET", "Prolog",
          }

          lang_totals = {}  # lang_name -> total lines

          total_code = 0
          for f in glob.glob("cloc_outputs/*.json"):
              try:
                  data = json.loads(Path(f).read_text())
              except Exception:
                  continue
              for lang, info in data.items():
                  if lang in ("SUM", "header"):
                      continue
                  if lang in EXCLUDE:
                      continue
                  lines = int(info.get("code", 0))
                  if lines > 0:
                      lang_totals[lang] = lang_totals.get(lang, 0) + lines
                      total_code += lines

          # Sort by lines descending
          sorted_langs = sorted(lang_totals.items(), key=lambda x: x[1], reverse=True)

          print(f"Total code lines (excl. data): {total_code:,}")
          print(f"Languages found: {len(sorted_langs)}")
          for name, lines in sorted_langs:
              pct = lines / total_code * 100 if total_code else 0
              print(f"  {name}: {lines:,} ({pct:.1f}%)")

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as f:
              f.write(f"TOTAL_CODE={total_code}\n")
              f.write(f"LANG_COUNT={len(sorted_langs)}\n")
              for i, (name, lines) in enumerate(sorted_langs, 1):
                  pct = f"{lines / total_code * 100:.1f}" if total_code else "0"
                  # Escape special chars for env var value — name is display name, safe as value
                  f.write(f"LANG{i}_NAME={name}\n")
                  f.write(f"LANG{i}_LINES={lines}\n")
                  f.write(f"LANG{i}_PCT={pct}\n")
          PYEOF

      - name: Fetch contribution streak
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, datetime

          # Prefer PAT_TOKEN for GraphQL (GITHUB_TOKEN has limited GraphQL access)
          token = os.environ.get("PAT_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
          username = "AtharvM02222"

          def graphql(query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
              result = json.loads(raw)
              if "errors" in result:
                  raise RuntimeError(f"GraphQL errors: {result['errors']}")
              return result

          try:
              # Step 1: get account creation year
              user_q = """
              query($login: String!) {
                user(login: $login) { createdAt }
              }"""
              user_data = graphql(user_q, {"login": username})
              created_at = user_data["data"]["user"]["createdAt"]
              start_year = int(created_at[:4])
              current_year = datetime.date.today().year

              print(f"Account created: {created_at}, scanning {start_year}–{current_year}")

              # Step 2: fetch each year's contribution calendar
              cal_q = """
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                        }
                      }
                    }
                  }
                }
              }"""

              all_days = []   # list of (date_str, count)
              total_all_time = 0

              for year in range(start_year, current_year + 1):
                  from_dt = f"{year}-01-01T00:00:00Z"
                  to_dt   = f"{year}-12-31T23:59:59Z"
                  data = graphql(cal_q, {"login": username, "from": from_dt, "to": to_dt})
                  cal  = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
                  total_all_time += cal["totalContributions"]
                  for week in cal["weeks"]:
                      for day in week["contributionDays"]:
                          all_days.append((day["date"], day["contributionCount"]))
                  print(f"  {year}: {cal['totalContributions']} contributions")

              # Deduplicate and sort
              all_days = sorted(set(all_days), key=lambda x: x[0])

              today = datetime.date.today().isoformat()
              yesterday = (datetime.date.today() - datetime.timedelta(days=1)).isoformat()

              # Current streak: walk backwards from today
              # Allow today to have 0 (day not over yet) — start counting from yesterday if today is 0
              current = 0
              started = False
              for date, count in reversed(all_days):
                  if date > today:
                      continue
                  # Skip today if it has no contributions yet (day may not be over)
                  if date == today and count == 0:
                      continue
                  if count > 0:
                      current += 1
                      started = True
                  else:
                      if started:
                          break

              # Longest streak: single pass
              longest = 0
              run = 0
              for _, count in all_days:
                  if count > 0:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0

              print(f"All-time total: {total_all_time:,}, Current streak: {current}, Longest: {longest}")

              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"STREAK_CURRENT={current}\n")
                  f.write(f"STREAK_LONGEST={longest}\n")
                  f.write(f"STREAK_TOTAL={total_all_time}\n")

          except Exception as e:
              import traceback
              traceback.print_exc()
              print(f"Streak fetch failed: {e}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("STREAK_CURRENT=0\nSTREAK_LONGEST=0\nSTREAK_TOTAL=0\n")
          PYEOF

      - name: Fetch GitHub stats
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os

          token    = os.environ.get("PAT_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
          username = "AtharvM02222"

          def graphql(query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
              result = json.loads(raw)
              if "errors" in result:
                  raise RuntimeError(f"GraphQL errors: {result['errors']}")
              return result

          try:
              q = """
              query($login: String!) {
                user(login: $login) {
                  repositories(first: 1, ownerAffiliations: OWNER) { totalCount }
                  contributedRepos: repositories(first: 1, ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) { totalCount }
                  ownedRepos: repositories(first: 100, ownerAffiliations: OWNER) {
                    nodes { stargazers { totalCount } }
                  }
                  followers { totalCount }
                  createdAt
                }
              }"""
              data = graphql(q, {"login": username})
              user = data["data"]["user"]
              stars    = sum(r["stargazers"]["totalCount"] for r in user["ownedRepos"]["nodes"])
              repos    = user["repositories"]["totalCount"]
              contrib  = user["contributedRepos"]["totalCount"]
              followers = user["followers"]["totalCount"]

              # All-time commits: sum contributions per year
              created_year = int(user["createdAt"][:4])
              import datetime
              current_year = datetime.date.today().year
              cal_q = """
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar { totalContributions }
                  }
                }
              }"""
              total_commits = 0
              for year in range(created_year, current_year + 1):
                  d = graphql(cal_q, {"login": username, "from": f"{year}-01-01T00:00:00Z", "to": f"{year}-12-31T23:59:59Z"})
                  total_commits += d["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]
                  print(f"  {year} commits: {d['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions']}")

              print(f"Total commits: {total_commits}, Stars: {stars}, Repos: {repos}, Followers: {followers}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"GH_COMMITS={total_commits}\n")
                  f.write(f"GH_STARS={stars}\n")
                  f.write(f"GH_REPOS={repos}\n")
                  f.write(f"GH_CONTRIB={contrib}\n")
                  f.write(f"GH_FOLLOWERS={followers}\n")
          except Exception as e:
              import traceback; traceback.print_exc()
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("GH_COMMITS=0\nGH_STARS=0\nGH_REPOS=0\nGH_CONTRIB=0\nGH_FOLLOWERS=0\n")
          PYEOF

      - name: Update SVGs with all stats
        run: |
          python3 << 'PYEOF'
          import os, re
          from lxml import etree

          def fmt(n):
              try:
                  return f"{int(n):,}"
              except:
                  return str(n)

          env = os.environ

          total_code      = fmt(env.get("TOTAL_CODE", "0"))
          repo_count      = env.get("REPO_COUNT", "0")
          total_added     = fmt(env.get("TOTAL_ADDED", "0"))
          total_changed   = fmt(env.get("TOTAL_CHANGED", "0"))
          total_deleted   = fmt(max(0, int(env.get("TOTAL_CHANGED", "0")) - int(env.get("TOTAL_ADDED", "0"))))
          streak_current  = env.get("STREAK_CURRENT", "0")
          streak_longest  = env.get("STREAK_LONGEST", "0")
          streak_total    = fmt(env.get("STREAK_TOTAL", "0"))
          lang_count      = int(env.get("LANG_COUNT", "0"))

          # GitHub stats
          gh_commits   = fmt(env.get("GH_COMMITS",   "0"))
          gh_stars     = fmt(env.get("GH_STARS",     "0"))
          gh_repos     = fmt(env.get("GH_REPOS",     "0"))
          gh_contrib   = fmt(env.get("GH_CONTRIB",   "0"))
          gh_followers = fmt(env.get("GH_FOLLOWERS", "0"))

          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          langs = []
          for i in range(1, lang_count + 1):
              name  = env.get(f"LANG{i}_NAME",  "-")
              lines = env.get(f"LANG{i}_LINES", "0")
              pct   = env.get(f"LANG{i}_PCT",   "0")
              if name and name != "-":
                  langs.append((name, fmt(lines), f"({pct}%)"))

          print(f"Total languages to render: {len(langs)}")

          SVG_NS   = "http://www.w3.org/2000/svg"

          # Layout constants
          LANG_Y0  = 690   # y-baseline of first lang row (matches section starting ~y=656 title)
          ROW_H    = 28    # pixels between lang rows

          def update_svg(filename, is_dark):
              tree = etree.parse(filename)
              root = tree.getroot()

              def set_id(eid, text):
                  el = root.find(f".//*[@id='{eid}']")
                  if el is not None:
                      el.text = str(text)

              # GitHub stats
              set_id("commit_data",   gh_commits)
              set_id("star_data",     gh_stars)
              set_id("repo_data",     gh_repos)
              set_id("contrib_data",  gh_contrib)
              set_id("follower_data", gh_followers)

              # LOC
              set_id("loc_data",    total_code)
              set_id("loc_add",     total_added)
              set_id("loc_del",     total_deleted)
              set_id("loc_changed", total_changed)

              # Streak
              set_id("streak_current", streak_current)
              set_id("streak_longest", streak_longest)
              set_id("streak_total",   streak_total)

              # "Across all X repositories"
              for el in root.iter():
                  if el.text and "Across all" in el.text:
                      el.text = f"Across all {repo_count} repositories"
                      break

              # Footer timestamp
              set_id("last_updated", f"Last updated: {now}")

              # ── Dynamically rebuild language rows ──
              # Remove all existing langN_* elements
              to_remove = []
              for el in root.iter():
                  eid = el.get("id") or ""
                  if re.match(r"lang\d+_(name|dots|lines|pct)$", eid):
                      to_remove.append(el)
              for el in to_remove:
                  for p in root.iter():
                      if el in list(p):
                          p.remove(el)
                          break

              # ── Calculate new layout from langs downward ──
              # lang rows: LANG_Y0 to LANG_Y0 + (n-1)*ROW_H
              last_lang_y   = LANG_Y0 + (len(langs) - 1) * ROW_H if langs else LANG_Y0
              divider1_y    = last_lang_y + 24    # divider after language section
              techstack_y   = divider1_y  + 34    # "Tech Stack" title
              ts_lang_y     = techstack_y + 34    # Languages row
              ts_web_y      = ts_lang_y   + 28    # Web row
              ts_hw_y       = ts_web_y    + 28    # Hardware row
              divider2_y    = ts_hw_y     + 22    # divider after Tech Stack
              discord_y     = divider2_y  + 34    # "Discord Presence" title
              dot_cy        = discord_y   + 32    # status dot cy
              status_y      = dot_cy              # status text y (aligned to dot)
              activity_y    = discord_y   + 66    # Activity row
              spotify_y     = discord_y   + 94    # Spotify row
              divider3_y    = discord_y   + 116   # divider after Discord
              footer_y      = divider3_y  + 38    # Footer text
              total_h       = footer_y    + 20    # total SVG height

              # Update SVG dimensions
              root.set("height", str(total_h))
              root.set("viewBox", f"0 0 860 {total_h}")
              for el in root.iter(f"{{{SVG_NS}}}rect"):
                  if el.get("width") == "860" and el.get("rx") == "10":
                      el.set("height", str(total_h))
                      break

              line_col = "#21262D" if is_dark else "#D0D7DE"

              # ── Update divider line positions ──
              # We identify dividers by their old approximate y and update them
              DIVIDER_MAP = {}
              dividers = [el for el in root.iter(f"{{{SVG_NS}}}line")
                          if el.get("x1") == "30" and el.get("x2") == "830"]
              # Sort by current y1
              dividers.sort(key=lambda el: int(el.get("y1", "0")))
              # Expected dividers (in order, after Languages section):
              # divider after languages, after tech stack, after discord, footer area
              # We find dividers with y1 >= 700 (after lang section start)
              post_lang_dividers = [el for el in dividers if int(el.get("y1", "0")) >= 700]
              targets = [divider1_y, divider2_y, divider3_y]
              for i, el in enumerate(post_lang_dividers[:3]):
                  y = targets[i]
                  el.set("y1", str(y))
                  el.set("y2", str(y))
                  el.set("stroke", line_col)

              # ── Update Tech Stack text positions ──
              def update_section_text(search_text, new_y):
                  for el in root.iter(f"{{{SVG_NS}}}text"):
                      if el.text and search_text in el.text:
                          el.set("y", str(new_y))
                          return True
                  return False

              update_section_text("Tech Stack",                 techstack_y)
              update_section_text("Python  •  TypeScript",      ts_lang_y)
              update_section_text("HTML  •  CSS",               ts_web_y)
              update_section_text("Arduino  •  ESP32",          ts_hw_y)

              # ── Update Discord Presence section positions ──
              update_section_text("Discord Presence",           discord_y)
              update_section_text("Auto-updated daily",         footer_y)

              # Status dot
              dot_el = root.find(".//*[@id='discord_status_dot']")
              if dot_el is not None:
                  dot_el.set("cy", str(dot_cy))

              # Status text
              status_el = root.find(".//*[@id='discord_status']")
              if status_el is not None:
                  status_el.set("y", str(dot_cy + 5))

              # Activity label + value
              for el in root.iter(f"{{{SVG_NS}}}text"):
                  if el.text == "Activity":
                      el.set("y", str(activity_y))
              act_el = root.find(".//*[@id='discord_activity']")
              if act_el is not None:
                  act_el.set("y", str(activity_y))

              # Spotify label + value
              for el in root.iter(f"{{{SVG_NS}}}text"):
                  if el.text == "Spotify":
                      el.set("y", str(spotify_y))
              sp_el = root.find(".//*[@id='discord_spotify']")
              if sp_el is not None:
                  sp_el.set("y", str(spotify_y))

              # ── Write language rows ──
              svg_root = root
              for i, (name, lines, pct) in enumerate(langs):
                  y = LANG_Y0 + i * ROW_H

                  def make_text(tid, x, yy, cls, text, anchor=None):
                      el = etree.SubElement(svg_root, f"{{{SVG_NS}}}text")
                      el.set("id", tid)
                      el.set("x", str(x))
                      el.set("y", str(yy))
                      el.set("class", cls)
                      if anchor:
                          el.set("text-anchor", anchor)
                      el.text = text
                      return el

                  make_text(f"lang{i+1}_name",  50,  y, "label",    name)
                  make_text(f"lang{i+1}_dots",  210, y, "dots",     ".................................")
                  make_text(f"lang{i+1}_lines", 680, y, "value",    lines, anchor="end")
                  make_text(f"lang{i+1}_pct",   690, y, "lang-pct", pct)

              tree.write(filename, encoding="utf-8", xml_declaration=True)
              print(f"✅ Updated {filename} — {len(langs)} lang rows, height={total_h}px")

          update_svg("dark_mode.svg",  is_dark=True)
          PYEOF

      - name: Update README badges
        run: |
          python3 << 'PYEOF'
          import re, os

          total_code        = os.environ.get("TOTAL_CODE", "0")
          repo_count        = os.environ.get("REPO_COUNT", "0")
          total_added_fmt   = os.environ.get("TOTAL_ADDED_FMT", "0")
          total_changed_fmt = os.environ.get("TOTAL_CHANGED_FMT", "0")

          total_lines_url   = total_code.replace(",", "%2C")
          total_added_url   = total_added_fmt.replace(",", "%2C")
          total_changed_url = total_changed_fmt.replace(",", "%2C")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'Total_Lines-[^"\'<\s]+-00d9ff',   f'Total_Lines-{total_lines_url}-00d9ff', content)
          content = re.sub(r'Repositories-\d+-00d9ff',          f'Repositories-{repo_count}-00d9ff', content)
          content = re.sub(r'Lines_Added-[^"\'<\s]+-00d9ff',    f'Lines_Added-{total_added_url}-00d9ff', content)
          content = re.sub(r'Lines_Changed-[^"\'<\s]+-00d9ff',  f'Lines_Changed-{total_changed_url}-00d9ff', content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          print("✅ README updated")
          PYEOF

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md dark_mode.svg

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update: stats, all languages, streak"

          for i in 1 2 3; do
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main && break
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} main
          done
